  };

  if (loading) return <div style={{ textAlign:"center",color:"#94a3b8",padding:60 }}>Loading…</div>;

  const dueSoon = items.filter(i=>{ const d=daysUntil(i.next_service); return d!==null && d<=30; }).length;
  const fmtDate = s => s ? String(s).slice(0,10) : "";

  return (
    <div style={{ padding:"20px 28px" }}>

      {/* Summary bar */}
      <div style={{ display:"flex",gap:16,marginBottom:20,flexWrap:"wrap",alignItems:"center" }}>
        <div style={{ background:T.white,border:`1.5px solid ${T.border}`,borderRadius:10,
          padding:"12px 20px",display:"flex",flexDirection:"column",gap:2,minWidth:130 }}>
          <div style={{ fontSize:10,fontWeight:700,color:"#94a3b8",letterSpacing:.7,textTransform:"uppercase" }}>Total Trucks</div>
          <div style={{ fontSize:28,fontWeight:700,color:T.slate,fontFamily:T.mono }}>{items.length}</div>
        </div>
        <div style={{ background:T.white,border:`1.5px solid ${T.border}`,borderRadius:10,
          padding:"12px 20px",display:"flex",flexDirection:"column",gap:2,minWidth:130 }}>
          <div style={{ fontSize:10,fontWeight:700,color:"#94a3b8",letterSpacing:.7,textTransform:"uppercase" }}>In Service</div>
          <div style={{ fontSize:28,fontWeight:700,color:"#15803d",fontFamily:T.mono }}>{items.filter(i=>i.status==="In Service").length}</div>
        </div>
        {dueSoon>0&&(
          <div style={{ background:"#fffbeb",border:"1.5px solid #fcd34d",borderRadius:10,
            padding:"12px 20px",display:"flex",flexDirection:"column",gap:2,minWidth:130 }}>
            <div style={{ fontSize:10,fontWeight:700,color:"#b45309",letterSpacing:.7,textTransform:"uppercase" }}>Service Due ≤30d</div>
            <div style={{ fontSize:28,fontWeight:700,color:"#b45309",fontFamily:T.mono }}>{dueSoon}</div>
          </div>
        )}
        <div style={{ marginLeft:"auto" }}>
          <Btn variant="primary" onClick={()=>setAddOpen(v=>!v)}>+ Add Truck</Btn>
        </div>
      </div>

      {/* Add form */}
      {addOpen&&(
        <div style={{ background:T.bg,border:`1.5px solid ${T.border}`,borderRadius:10,
          padding:"16px 20px",marginBottom:16,display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end" }}>
          <div style={{ width:120 }}><FWrap label="Truck ID"><input value={nf.truck_tag} onChange={e=>setNf({...nf,truck_tag:e.target.value})} placeholder="MBS-T01" style={{...iBase}} autoFocus /></FWrap></div>
          <div style={{ width:90 }}><FWrap label="Year"><input value={nf.year} onChange={e=>setNf({...nf,year:e.target.value})} placeholder="2022" style={{...iBase}} /></FWrap></div>
          <div style={{ flex:1,minWidth:160 }}><FWrap label="Make / Model"><input value={nf.make_model} onChange={e=>setNf({...nf,make_model:e.target.value})} placeholder="Ford F-250" style={{...iBase}} /></FWrap></div>
          <div style={{ width:110 }}><FWrap label="Plate"><input value={nf.plate} onChange={e=>setNf({...nf,plate:e.target.value})} style={{...iBase}} /></FWrap></div>
          <div style={{ width:150 }}><FWrap label="Status"><select value={nf.status} onChange={e=>setNf({...nf,status:e.target.value})} style={{...iBase,cursor:"pointer"}}>
            {TRUCK_STATUSES.map(s=><option key={s} value={s}>{s}</option>)}</select></FWrap></div>
          <div style={{ width:150 }}><FWrap label="Assigned Driver / Crew"><input value={nf.assigned_to} onChange={e=>setNf({...nf,assigned_to:e.target.value})} style={{...iBase}} /></FWrap></div>
          <div style={{ width:110 }}><FWrap label="Mileage"><input value={nf.mileage} onChange={e=>setNf({...nf,mileage:e.target.value})} style={{...iBase}} /></FWrap></div>
          <div style={{ width:150 }}><FWrap label="Last Service"><input type="date" value={nf.last_service} onChange={e=>setNf({...nf,last_service:e.target.value})} style={{...iBase}} /></FWrap></div>
          <div style={{ width:150 }}><FWrap label="Next Service Due"><input type="date" value={nf.next_service} onChange={e=>setNf({...nf,next_service:e.target.value})} style={{...iBase}} /></FWrap></div>
          <div style={{ display:"flex",gap:8 }}>
            <Btn variant="secondary" onClick={()=>setAddOpen(false)}>Cancel</Btn>
            <Btn variant="primary" onClick={addItem} style={{ opacity:(nf.truck_tag.trim()||nf.make_model.trim())?1:.4 }}>Add</Btn>
          </div>
        </div>
      )}

      {/* Table */}
      <div style={{ background:T.white,border:`1.5px solid ${T.border}`,borderRadius:10,overflow:"hidden",
        boxShadow:"0 1px 4px rgba(0,0,0,.04)" }}>
        <table style={{ width:"100%",borderCollapse:"collapse" }}>
          <thead>
            <tr style={{ background:T.bg,borderBottom:`1.5px solid ${T.border}` }}>
              {["Truck","Year","Make / Model","Plate","Status","Driver / Crew","Mileage","Last Service","Next Service",""].map(h=>(
                <th key={h} style={{ textAlign:"left",padding:"9px 14px",fontSize:11,
                  fontWeight:700,color:"#94a3b8",letterSpacing:.7,textTransform:"uppercase",whiteSpace:"nowrap" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {items.map((item,i)=>{
              const isEditing = editId===item.id;
              const d = daysUntil(item.next_service);
              const overdue = d!==null && d<0;
              const soon = d!==null && d>=0 && d<=30;
              return (
                <tr key={item.id} style={{ borderBottom:i<items.length-1?`1px solid ${T.border}`:"none",
                  background:overdue?"#fef2f2":soon?"#fffdf4":"transparent" }}>
                  <td style={{ padding:"12px 14px",fontSize:13,fontWeight:700,fontFamily:T.mono,color:T.slate }}>
                    {isEditing ? <input value={item.truck_tag||""} onChange={e=>updateField(item.id,"truck_tag",e.target.value)} style={{...iBase,fontSize:13,width:90}} /> : (item.truck_tag||"—")}
                  </td>
                  <td style={{ padding:"12px 14px",fontSize:13,color:T.muted }}>
                    {isEditing ? <input value={item.year||""} onChange={e=>updateField(item.id,"year",e.target.value)} style={{...iBase,fontSize:13,width:70}} /> : (item.year||"—")}
                  </td>
                  <td style={{ padding:"12px 14px",fontSize:14,fontWeight:600,color:T.slate }}>
                    {isEditing ? <input value={item.make_model||""} onChange={e=>updateField(item.id,"make_model",e.target.value)} style={{...iBase,fontSize:14,fontWeight:600}} /> : (item.make_model||"—")}
                  </td>
                  <td style={{ padding:"12px 14px",fontSize:13,fontFamily:T.mono,color:T.muted }}>
                    {isEditing ? <input value={item.plate||""} onChange={e=>updateField(item.id,"plate",e.target.value)} style={{...iBase,fontSize:13,width:90}} /> : (item.plate||"—")}
                  </td>
                  <td style={{ padding:"12px 14px" }}>
                    {isEditing ? (
                      <select value={item.status||""} onChange={e=>updateField(item.id,"status",e.target.value)} style={{...iBase,cursor:"pointer"}}>
                        {TRUCK_STATUSES.map(s=><option key={s} value={s}>{s}</option>)}</select>
                    ) : <Badge status={item.status} />}
                  </td>
                  <td style={{ padding:"12px 14px" }}>
                    {isEditing ? <input value={item.assigned_to||""} onChange={e=>updateField(item.id,"assigned_to",e.target.value)} style={{...iBase,fontSize:13}} /> :
                      <span style={{ fontSize:13,color:item.assigned_to?T.slate:"#d1d5db" }}>{item.assigned_to||"—"}</span>}
                  </td>
                  <td style={{ padding:"12px 14px",fontSize:13,fontFamily:T.mono,color:T.muted }}>
                    {isEditing ? <input value={item.mileage||""} onChange={e=>updateField(item.id,"mileage",e.target.value)} style={{...iBase,fontSize:13,width:80}} /> :
                      (item.mileage!=null ? Number(item.mileage).toLocaleString() : "—")}
                  </td>
                  <td style={{ padding:"12px 14px",fontSize:13,color:T.muted }}>
                    {isEditing ? <input type="date" value={fmtDate(item.last_service)} onChange={e=>updateField(item.id,"last_service",e.target.value)} style={{...iBase,fontSize:13}} /> : (fmtDate(item.last_service)||"—")}
                  </td>
                  <td style={{ padding:"12px 14px",fontSize:13 }}>
                    {isEditing ? <input type="date" value={fmtDate(item.next_service)} onChange={e=>updateField(item.id,"next_service",e.target.value)} style={{...iBase,fontSize:13}} /> : (
                      item.next_service ? (
                        <span style={{ display:"flex",alignItems:"center",gap:6,color:overdue?"#dc2626":soon?"#b45309":T.muted,fontWeight:overdue||soon?700:400 }}>
                          {fmtDate(item.next_service)}
                          {overdue&&<span style={{ fontSize:10,fontWeight:700,color:"#dc2626",background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:20,padding:"1px 7px" }}>Overdue</span>}
                          {soon&&<span style={{ fontSize:10,fontWeight:700,color:"#b45309",background:"#fef3c7",border:"1px solid #fcd34d",borderRadius:20,padding:"1px 7px" }}>Due soon</span>}
                        </span>
                      ) : <span style={{color:"#d1d5db"}}>—</span>
                    )}
                  </td>
                  <td style={{ padding:"12px 14px",whiteSpace:"nowrap" }}>
                    <div style={{ display:"flex",gap:6,justifyContent:"flex-end" }}>
                      <Btn variant="secondary" sm onClick={()=>setEditId(isEditing?null:item.id)}>{isEditing?"✓ Done":"Edit"}</Btn>
                      {confirmDel===item.id ? (
                        <>
                          <Btn variant="danger" sm onClick={()=>deleteItem(item.id)}>Delete</Btn>
                          <Btn variant="secondary" sm onClick={()=>setConfirmDel(null)}>Cancel</Btn>
                        </>
                      ) : <Btn variant="danger" sm onClick={()=>setConfirmDel(item.id)}>✕</Btn>}
                    </div>
                  </td>
                </tr>
              );
            })}
            {items.length===0&&<tr><td colSpan={10} style={{ padding:"40px",textAlign:"center",color:"#94a3b8",fontSize:13 }}>No trucks yet. Click <strong>+ Add Truck</strong> to get started.</td></tr>}
          </tbody>
        </table>
      </div>

      <div style={{ marginTop:12,fontSize:11,color:"#94a3b8" }}>
        Rows turn amber when the next service is due within 30 days, red when overdue.
      </div>
    </div>
  );
}


function App() {
  function DashboardTab({ data, loading, error }) {
  if (loading) {
    return (
      <div style={{ padding:40,color:T.muted }}>
        Loading dashboard…
      </div>
    );
  }

  if (error) {
    return (
      <div style={{ padding:40,color:"#dc2626" }}>
        {error}
      </div>
    );
  }

  if (!data) {
    return null;
  }

  return (
    <div style={{ padding:"24px 28px",background:T.bg,minHeight:"calc(100vh - 110px)" }}>
      <div style={{ marginBottom:20 }}>
        <div style={{ fontSize:22,fontWeight:700,color:T.slate }}>
          Operations Dashboard
        </div>
        <div style={{ fontSize:13,color:T.muted,marginTop:4 }}>
          Current asset status, inventory alerts, and recent activity
        </div>
      </div>

      <div style={{
        display:"grid",
        gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",
        gap:14,
        marginBottom:22
      }}>
        {[
          ["Total Assets", data.assets.total],
          ["Assigned", data.assets.assigned],
          ["Available", data.assets.available],
          ["Low Consumables", data.alerts.lowConsumables.length],
          ["Low Shirts", data.alerts.lowShirts.length],
        ].map(([label,value])=>(
          <div key={label} style={{
            background:T.white,
            border:`1.5px solid ${T.border}`,
            borderRadius:10,
            padding:"18px 20px"
          }}>
            <div style={{
              fontSize:11,
              fontWeight:700,
              color:T.muted,
              textTransform:"uppercase",
              letterSpacing:.7
            }}>
              {label}
            </div>
            <div style={{
              fontSize:30,
              fontWeight:700,
              marginTop:6,
              fontFamily:T.mono,
              color:T.slate
            }}>
              {value}
            </div>
          </div>
        ))}
      </div>

      <div style={{
        display:"grid",
        gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))",
        gap:18
      }}>
        <div style={{
          background:T.white,
          border:`1.5px solid ${T.border}`,
          borderRadius:10,
          padding:20
        }}>
          <div style={{ fontSize:15,fontWeight:700,marginBottom:12 }}>
            Low Consumables
          </div>

          {data.alerts.lowConsumables.length === 0 ? (
            <div style={{ color:T.muted,fontSize:13 }}>
              No low-stock consumables.
            </div>
          ) : (
            data.alerts.lowConsumables.map(item=>(
              <div key={item.id} style={{
                display:"flex",
                justifyContent:"space-between",
                padding:"8px 0",
                borderBottom:`1px solid ${T.border}`
              }}>
                <span>{item.name}</span>
                <strong>{item.quantity} / {item.low_at}</strong>
              </div>
            ))
          )}
        </div>

        <div style={{
          background:T.white,
          border:`1.5px solid ${T.border}`,
          borderRadius:10,
          padding:20
        }}>
          <div style={{ fontSize:15,fontWeight:700,marginBottom:12 }}>
            Low Shirts
          </div>

          {data.alerts.lowShirts.length === 0 ? (
            <div style={{ color:T.muted,fontSize:13 }}>
              No low-stock shirts.
            </div>
          ) : (
            data.alerts.lowShirts.map(item=>(
              <div key={item.id} style={{
                display:"flex",
                justifyContent:"space-between",
                padding:"8px 0",
                borderBottom:`1px solid ${T.border}`
              }}>
                <span>{item.color} — {item.size}</span>
                <strong>{item.quantity}</strong>
              </div>
            ))
          )}
        </div>

        <div style={{
          background:T.white,
          border:`1.5px solid ${T.border}`,
          borderRadius:10,
          padding:20
        }}>
          <div style={{ fontSize:15,fontWeight:700,marginBottom:12 }}>
            Recent Activity
          </div>

          {data.recentActivity.length === 0 ? (
            <div style={{ color:T.muted,fontSize:13 }}>
              No recent activity.
            </div>
          ) : (
            data.recentActivity.map(item=>(
              <div key={item.id} style={{
                padding:"8px 0",
                borderBottom:`1px solid ${T.border}`
              }}>
                <div style={{ fontWeight:600 }}>
                  {item.action}
                </div>
                <div style={{ fontSize:12,color:T.muted }}>
                  {item.username || "Unknown"} — {item.details}
                </div>
              </div>
            ))
          )}
        </div>
      </div>
    </div>
  );
}
  const [assets,setAssets]         = useState([]);
  const [counter,setCounter]       = useState(1000);
  const [loading,setLoading]       = useState(true);
  const [modal,setModal]           = useState(null);
  const [selected,setSelected]     = useState(null);
  const [search,setSearch]         = useState("");
  const [fType,setFType]           = useState("All");
  const [fStatus,setFStatus]       = useState("All");
  const [fQR,setFQR]               = useState("All");
  const [sortBy,setSortBy]         = useState("tag");
  const [showLookup,setShowLookup] = useState(false);
  const [activeTab,setActiveTab]   = useState("dashboard");
  const [dashboard,setDashboard]   = useState(null);
  const [dashboardLoading,setDashboardLoading] = useState(false);
  const [dashboardError,setDashboardError] = useState("");
  const [user,setUser]             = useState(null);
  const [authReady,setAuthReady]   = useState(false);

  // Check for existing token on mount
  useEffect(()=>{
    if (window.authToken) {
      // Validate token by hitting a protected endpoint
      window.api.get('/api/assets').then(()=>{
        // Token is valid — but we don't have user info stored, so parse JWT
        try {
          const payload = JSON.parse(atob(window.authToken.split('.')[1]));
          setUser({ username: payload.username, role: payload.role });
        } catch { window.api.setToken(null); }
        setAuthReady(true);
      }).catch(()=>{
        window.api.setToken(null);
        setAuthReady(true);
      });
    } else {
      setAuthReady(true);
    }
  },[]);

  useEffect(()=>{
    if (!user) return;
    (async()=>{
      const a = await loadAssets();
      // Derive counter from highest asset tag number
      const maxTag = a.reduce((max, asset) => {
        const num = parseInt((asset.tag||'').replace('MBS-','')) || 0;
        return Math.max(max, num);
      }, 1000);
      setAssets(a); setCounter(maxTag); setLoading(false);
      // QR deep link: ?asset=MBS-LT-304 opens that asset automatically
      const params = new URLSearchParams(window.location.search);
      const qrTag = params.get('asset');
      if (qrTag) {
        const found = a.find(x => x.tag === qrTag);
        if (found) { setSelected(found); setModal({type:'detail'}); }
        window.history.replaceState({}, '', '/');
      }
    })();
  },[user]);
  useEffect(()=>{
  if (!user || activeTab !== "dashboard") return;

  let cancelled = false;

  (async()=>{
    setDashboardLoading(true);
    setDashboardError("");

    try {
      const data = await window.api.get('/api/dashboard');

      if (!cancelled) {
        setDashboard(data);
      }
    } catch (error) {
      if (!cancelled) {
        setDashboardError(error.message || "Unable to load dashboard");
      }
    } finally {
      if (!cancelled) {
        setDashboardLoading(false);
      }
    }
  })();

  return () => {
    cancelled = true;
  };
}, [user, activeTab]);

  const persist=useCallback(async next=>{ setAssets(next); },[]);

  const handleLogout = () => {
    window.api.setToken(null);
    setUser(null);
    setAssets([]);
    setLoading(true);
  };

  const [warnLogout, setWarnLogout] = useState(false);
  useEffect(() => {
    if (!user) return;
    let warnTimer, logoutTimer;
    const reset = () => {
      clearTimeout(warnTimer);
      clearTimeout(logoutTimer);
      setWarnLogout(false);
      warnTimer   = setTimeout(() => setWarnLogout(true),  25 * 60 * 1000);
      logoutTimer = setTimeout(() => handleLogout(),        30 * 60 * 1000);
    };
    const events = ['mousemove','mousedown','keydown','touchstart','scroll'];
    events.forEach(e => window.addEventListener(e, reset));
    reset();
    return () => {
      clearTimeout(warnTimer);
      clearTimeout(logoutTimer);
      events.forEach(e => window.removeEventListener(e, reset));
    };
  }, [user]);

  const stats={
    total:assets.length,
    inService:assets.filter(a=>a.status==="In Service").length,
    inStorage:assets.filter(a=>a.status==="In Storage").length,
    repair:assets.filter(a=>a.status==="Awaiting Repair").length,
    linked:assets.filter(a=>a.qrCode).length,
    unlinked:assets.filter(a=>!a.qrCode).length,
  };

  const filtered=assets.filter(a=>{
    const q=search.toLowerCase();
    const mQ=!q||[a.tag,a.name,a.make,a.model,a.serial,a.imei,a.assignedTo,a.entraName,a.department,a.qrCode].some(f=>f?.toLowerCase().includes(q));
    return mQ&&(fType==="All"||a.type===fType)&&(fStatus==="All"||a.status===fStatus)
      &&(fQR==="All"||(fQR==="Linked"&&!!a.qrCode)||(fQR==="Unlinked"&&!a.qrCode));
  }).sort((a,b)=>{
    if(sortBy==="tag")    return a.tag.localeCompare(b.tag);
    if(sortBy==="name")   return (a.name||"").localeCompare(b.name||"");
    if(sortBy==="status") return a.status.localeCompare(b.status);
    if(sortBy==="type")   return a.type.localeCompare(b.type);
    return 0;
  });

  const handleAdd=async f=>{
    try {
      const body = {
        asset_tag: f.tag, type: f.type, name: f.name, make: f.make, model: f.model,
        serial_number: f.serial, assigned_to: f.assignedTo, location: f.location,
        status: f.status, condition: f.condition, windows_license: f.windowsLicense,
        autopilot_ready: f.autopilotReady, notes: f.notes,
        entra_name: f.entraName, department: f.department,
        imei: f.imei, warranty_expiry: f.warrantyExpiry, warranty_expired: f.warrantyExpired,
      };
      const created = await window.api.post('/api/assets', body);
      const mapped = { ...f, id: created.id, createdAt: created.created_at, history:[], shippingRecords:[], qrCode:"" };
      const nc = counter + 1;
      setAssets(prev => [...prev, mapped]);
      setCounter(nc);
      setModal(null);
    } catch(e) { alert("Failed to add asset: " + e.message); }
  };

  const handleEdit=async f=>{
    try {
      const body = {
        asset_tag: f.tag, type: f.type, name: f.name, make: f.make, model: f.model,
        serial_number: f.serial, assigned_to: f.assignedTo, location: f.location,
        status: f.status, condition: f.condition, windows_license: f.windowsLicense,
        autopilot_ready: f.autopilotReady, notes: f.notes,
        entra_name: f.entraName, department: f.department,
        imei: f.imei, warranty_expiry: f.warrantyExpiry, warranty_expired: f.warrantyExpired,
      };
      await window.api.put('/api/assets/' + selected.id, body);
      setAssets(prev => prev.map(a => a.id===selected.id ? {...a,...f} : a));
      setSelected(s=>({...s,...f}));
      setModal({type:"detail"});
    } catch(e) { alert("Failed to update asset: " + e.message); }
  };
  const handleCheckin=async f=>{
    const entry={...f,date:nowISO()};
    const updated = assets.map(a=>a.id===selected.id
      ?{...a,status:f.newStatus,condition:f.conditionOnReturn,history:[...(a.history||[]),entry]}:a);
    setAssets(updated);
    // Persist status/condition change
    const asset = updated.find(a=>a.id===selected.id);
    await window.api.put('/api/assets/'+selected.id, {
      asset_tag:asset.tag, type:asset.type, make:asset.make, model:asset.model,
      serial_number:asset.serial, assigned_to:asset.assignedTo, location:asset.location,
      status:f.newStatus, condition:f.conditionOnReturn, windows_license:asset.windowsLicense,
      autopilot_ready:asset.autopilotReady, notes:asset.notes,
    });
    setSelected(s=>({...s,status:f.newStatus,condition:f.conditionOnReturn,history:[...(s.history||[]),entry]}));
    setModal({type:"detail"});
  };
  const handleShipping=async f=>{
    const entry={...f,date:nowISO()};
    setAssets(prev=>prev.map(a=>a.id===selected.id
      ?{...a,shippingRecords:[...(a.shippingRecords||[]),entry]}:a));
    setSelected(s=>({...s,shippingRecords:[...(s.shippingRecords||[]),entry]}));
    setModal({type:"detail"});
  };
  const handleLinkQR=async val=>{
    if(!val||assets.find(a=>a.id!==selected.id&&a.qrCode===val)) return;
    try {
      await window.api.put('/api/assets/'+selected.id, {
        asset_tag:selected.tag, type:selected.type, name:selected.name, make:selected.make, model:selected.model,
        serial_number:selected.serial, assigned_to:selected.assignedTo, location:selected.location,
        status:selected.status, condition:selected.condition, windows_license:selected.windowsLicense,
        autopilot_ready:selected.autopilotReady, notes:selected.notes,
        entra_name:selected.entraName, department:selected.department,
        imei:selected.imei, warranty_expiry:selected.warrantyExpiry, warranty_expired:selected.warrantyExpired,
        qr_code:val,
      });
      setAssets(prev=>prev.map(a=>a.id===selected.id?{...a,qrCode:val}:a));
      setSelected(s=>({...s,qrCode:val}));
      setModal({type:"detail"});
    } catch(e) { alert("Failed to link QR: "+e.message); }
  };
  const handleRemoveQR=async()=>{
    try {
      await window.api.put('/api/assets/'+selected.id, {
        asset_tag:selected.tag, type:selected.type, name:selected.name, make:selected.make, model:selected.model,
        serial_number:selected.serial, assigned_to:selected.assignedTo, location:selected.location,
        status:selected.status, condition:selected.condition, windows_license:selected.windowsLicense,
        autopilot_ready:selected.autopilotReady, notes:selected.notes,
        entra_name:selected.entraName, department:selected.department,
        imei:selected.imei, warranty_expiry:selected.warrantyExpiry, warranty_expired:selected.warrantyExpired,
        qr_code:"",
      });
      setAssets(prev=>prev.map(a=>a.id===selected.id?{...a,qrCode:""}:a));
      setSelected(s=>({...s,qrCode:""}));
      setModal({type:"detail"});
    } catch(e) { alert("Failed to remove QR: "+e.message); }
  };
  const handleDelete=async()=>{
    try {
      await window.api.del('/api/assets/'+selected.id);
      setAssets(prev=>prev.filter(a=>a.id!==selected.id));
      setSelected(null); setModal(null);
    } catch(e) { alert("Failed to delete: " + e.message); }
  };
  const openDetail=a=>{ setSelected(a); setModal({type:"detail"}); };




  const handleExportCSV = () => {
    const cols = ['Asset Tag','Type','Name','Make','Model','Serial Number','Assigned To','Location','Status','Condition','Windows License','Autopilot Ready','Entra / Intune Name','Department','IMEI','Warranty Expiry','Notes'];
    const esc = v => '"' + String(v||'').split('"').join('""').split('\n').join(' ') + '"';
    const rows = assets.map(a => [a.tag,a.type,a.name,a.make,a.model,a.serial,a.assignedTo,a.location,a.status,a.condition,a.windowsLicense?'Yes':'No',a.autopilotReady?'Yes':'No',a.entraName,a.department,a.imei,a.warrantyExpiry||'',a.notes].map(esc).join(','));
    const csv = [cols.join(',')].concat(rows).join('\n');
    const blob = new Blob([csv],{type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const lnk = document.createElement('a');
    lnk.href = url;
    lnk.download = 'MBS-Assets-' + new Date().toISOString().slice(0,10) + '.csv';
    lnk.click();
    URL.revokeObjectURL(url);
  };

  const handleImportCSV = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const lines = ev.target.result.split('\n').filter(l => l.trim());
        const parse = line => { const v=[]; let c='',q=false; for(let x of line){if(x==='"')q=!q; else if(x===','&&!q){v.push(c);c='';}else c+=x;} v.push(c); return v; };
        const hdrs = parse(lines[0]).map(h => h.trim());
        let ok=0, skip=0;
        for(const line of lines.slice(1)) {
          const vals = parse(line);
          const r = {}; hdrs.forEach((h,i) => r[h]=(vals[i]||'').trim());
          if(!r['Asset Tag']){skip++;continue;}
          try {
            await window.api.post('/api/assets',{asset_tag:r['Asset Tag'],type:r['Type'],name:r['Name'],make:r['Make'],model:r['Model'],serial_number:r['Serial Number'],assigned_to:r['Assigned To'],location:r['Location'],status:r['Status'],condition:r['Condition'],windows_license:r['Windows License']==='Yes',autopilot_ready:r['Autopilot Ready']==='Yes',entra_name:r['Entra / Intune Name'],department:r['Department'],imei:r['IMEI'],warranty_expiry:r['Warranty Expiry']||null,notes:r['Notes']});
            ok++;
          } catch { skip++; }
        }
        const fresh = await window.api.get('/api/assets');
        setAssets(fresh.map(a => ({id:a.id,tag:a.asset_tag,type:a.type,name:a.name,make:a.make,model:a.model,serial:a.serial_number,assignedTo:a.assigned_to,location:a.location,status:a.status||'In Storage',condition:a.condition,windowsLicense:a.windows_license,autopilotReady:a.autopilot_ready,notes:a.notes,entraName:a.entra_name||'',department:a.department||'',imei:a.imei||'',warrantyExpiry:a.warranty_expiry,warrantyExpired:a.warranty_expired,history:a.history||[],shippingRecords:a.shipping_records||[],qrCode:a.qr_code||'',photos:a.photos||[]})));
        alert('Done! ' + ok + ' imported, ' + skip + ' skipped.');
      } catch(err) { alert('Failed: ' + err.message); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const handleExport = () => {
    const data = { assets, counter, exportedAt: nowISO(), version: "mbs-v3" };
    const json = JSON.stringify(data, null, 2);
    // Try clipboard first, fall back to a text window
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).then(() => {
        alert("Data copied to clipboard! Paste it into Notepad, save as mbs-backup.json, then import into the HTML app.");
      }).catch(() => showDataWindow(json));
    } else {
      showDataWindow(json);
    }
  };

  const showDataWindow = (json) => {
    const w = window.open("", "_blank", "width=600,height=400");
    w.document.write("<html><body><p><b>Select all text below, copy it, paste into Notepad, save as mbs-backup.json</b></p><textarea style='width:100%;height:320px;font-size:11px'>" + json.replace(/</g,"&lt;") + "</textarea></body></html>");
  };

  const handleImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.assets || !Array.isArray(data.assets)) throw new Error("Invalid file");
        await persist(data.assets);
        if (data.counter) { setCounter(data.counter); await saveCounter(data.counter); }
        alert("Imported " + data.assets.length + " assets successfully.");
      } catch { alert("Import failed — file may be invalid or corrupted."); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  return (
    <div style={{ minHeight:"100vh",background:T.white,fontFamily:T.font,color:T.slate }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
        *{box-sizing:border-box;margin:0;padding:0}
        ::-webkit-scrollbar{width:6px;height:6px;background:#f1f5f9}
        ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
        button:hover{opacity:.82}
        .rh:hover{background:${T.bg} !important;cursor:pointer}
        input:focus,select:focus,textarea:focus{border-color:${T.amber} !important;outline:none}
      `}</style>

      {/* Auth gate */}
      {!authReady && (
        <div style={{ minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:T.muted,fontSize:15 }}>
          Connecting…
        </div>
      )}
      {authReady && !user && <LoginScreen onLogin={(u,t)=>setUser(u)} />}
      {authReady && user && (<>

      {warnLogout && (
        <div style={{ position:"fixed", bottom:24, right:24, zIndex:9999,
          background:"#1e293b", color:"#fff", borderRadius:12, padding:"16px 20px",
          boxShadow:"0 8px 32px rgba(0,0,0,.25)", display:"flex", alignItems:"center", gap:14,
          border:"1.5px solid #f59e0b" }}>
          <span style={{ fontSize:20 }}>⚠️</span>
          <div>
            <div style={{ fontWeight:700, fontSize:14, marginBottom:2 }}>Session expiring soon</div>
            <div style={{ fontSize:12, color:"#94a3b8" }}>You will be logged out in 5 minutes due to inactivity.</div>
          </div>
          <button onClick={()=>setWarnLogout(false)}
            style={{ background:"#f59e0b", border:"none", borderRadius:6, color:"#fff",
              fontWeight:700, fontSize:12, padding:"6px 12px", cursor:"pointer", marginLeft:8 }}>
            Stay Logged In
          </button>
        </div>
      )}

      {/* Nav */}
      <div style={{ background:T.white,borderBottom:`1.5px solid ${T.border}`,padding:"0 28px",
        display:"flex",justifyContent:"space-between",alignItems:"center",height:58,
        position:"sticky",top:0,zIndex:100,boxShadow:"0 1px 8px rgba(0,0,0,.06)" }}>
        <div style={{ display:"flex",alignItems:"center",gap:12 }}>
          <div style={{ width:34,height:34,background:T.amber,borderRadius:8,fontSize:18,
            display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 2px 6px ${T.amber}55` }}>☀</div>
          <div>
            <div style={{ fontSize:15,fontWeight:700,color:T.slate }}>Miller Bros Solar</div>
            <div style={{ fontSize:10,color:T.muted,letterSpacing:.8,textTransform:"uppercase" }}>IT Asset Management</div>
          </div>
        </div>
        <div style={{ display:"flex",gap:8,alignItems:"center" }}>
          <Btn variant="secondary" sm onClick={()=>setShowLookup(v=>!v)}>▣ QR Lookup</Btn>
          <Btn variant="secondary" sm onClick={handleExportCSV}>Export CSV</Btn>
          <label><input type="file" accept=".csv" style={{display:"none"}} onChange={handleImportCSV}/><Btn variant="secondary" sm onClick={()=>{}}>Import CSV</Btn></label>
          {activeTab==="assets"&&<Btn variant="primary" onClick={()=>setModal({type:"add"})}>+ New Asset</Btn>}
          <div style={{ display:"flex",alignItems:"center",gap:8,marginLeft:8,
            padding:"5px 12px",background:T.bg,borderRadius:7,border:`1.5px solid ${T.border}` }}>
            <span style={{ fontSize:12,fontWeight:600,color:T.slate }}>👤 {user.username}</span>
            {user.role==="admin"&&<span style={{ fontSize:10,fontWeight:700,color:T.amberD,background:T.amberL,
              padding:"1px 6px",borderRadius:4,border:`1px solid #fcd34d` }}>admin</span>}
          </div>
          <Btn variant="secondary" sm onClick={handleLogout}>Sign Out</Btn>
        </div>
      </div>

      {/* Tab Bar */}
      <div style={{ background:T.white,borderBottom:`1.5px solid ${T.border}`,
        padding:"0 28px",display:"flex",gap:0 }}>
        [{[
  ["dashboard","▦  Dashboard"],
  ["assets","📋  IT Assets"],
  ["consumables","🔌  Consumables"],
  ["shirts","👕  Shirts"],
  ["tools","🔧  Field Tools"],
  ["trucks","🚚  Trucks"]
].map(([key,label])=>(
  <button key={key} onClick={()=>setActiveTab(key)}
    style={{ background:"none",border:"none",borderBottom:`3px solid ${activeTab===key?T.amber:"transparent"}`,
      padding:"12px 20px",fontSize:13,fontWeight:activeTab===key?700:500,
      color:activeTab===key?T.slate:T.muted,cursor:"pointer",
      fontFamily:T.font,transition:"color .15s",marginBottom:-1 }}>
    {label}
  </button>
))}
        [
      </div>

      {/* Stats — assets tab only */}
      {activeTab==="assets"&&<div style={{ background:T.white,borderBottom:`1.5px solid ${T.border}`,display:"flex",overflowX:"auto" }}>
        {[
          ["Total",       stats.total,     T.slate,   null,             null],
          ["In Service",  stats.inService, "#15803d", "In Service",     null],
          ["In Storage",  stats.inStorage, "#1d4ed8", "In Storage",     null],
          ["Needs Repair",stats.repair,    "#b45309", "Awaiting Repair",null],
          ["QR Linked",   stats.linked,    T.amberD,  null,             "Linked"],
          ["No QR Tag",   stats.unlinked,  "#94a3b8", null,             "Unlinked"],
        ].map(([label,val,color,sf,qf])=>(
          <div key={label} onClick={()=>{ if(sf) setFStatus(fStatus===sf?"All":sf); if(qf) setFQR(fQR===qf?"All":qf); }}
            style={{ padding:"12px 22px",borderRight:`1px solid ${T.border}`,minWidth:110,cursor:"pointer",
              transition:"background .15s",background:((sf&&fStatus===sf)||(qf&&fQR===qf))?T.amberL:T.white }}>
            <div style={{ fontSize:10,fontWeight:700,color:"#94a3b8",letterSpacing:.7,textTransform:"uppercase" }}>{label}</div>
            <div style={{ fontSize:26,fontWeight:700,color,marginTop:1,fontFamily:T.mono }}>{val}</div>
          </div>
        ))}
        {(fStatus!=="All"||fQR!=="All")&&(
          <div style={{ padding:"12px 14px",display:"flex",alignItems:"center" }}>
            <button onClick={()=>{setFStatus("All");setFQR("All");}} style={{ fontSize:12,color:T.muted,
              background:T.bg,border:`1px solid ${T.border}`,borderRadius:5,padding:"4px 10px",cursor:"pointer" }}>Clear ×</button>
          </div>
        )}
      </div>}

      {activeTab==="dashboard" ? (
  <DashboardTab
    data={dashboard}
    loading={dashboardLoading}
    error={dashboardError}
  />
) : activeTab==="consumables" ? <ConsumablesTab />
  : activeTab==="shirts" ? <ShirtsTab />
  : activeTab==="tools" ? <ToolsTab />
  : activeTab==="trucks" ? <TrucksTab />
  : (
    <div style={{ padding:"20px 28px" }}>
      {showLookup&&<div style={{ marginBottom:16 }}><QRLookup assets={assets} onSelect={a=>{ openDetail(a); setShowLookup(false); }} /></div>}

        {/* Filters */}
        <div style={{ display:"flex",gap:10,marginBottom:16,flexWrap:"wrap" }}>
          <input placeholder="Search tag, name, serial, QR, user…" value={search} onChange={e=>setSearch(e.target.value)}
            style={{ ...iBase,flex:1,minWidth:220,maxWidth:380 }} />
          <select value={fType} onChange={e=>setFType(e.target.value)} style={{ ...iBase,width:"auto",minWidth:130 }}>
            <option value="All">All Types</option>{ASSET_TYPES.map(t=><option key={t}>{t}</option>)}
          </select>
          <select value={fStatus} onChange={e=>setFStatus(e.target.value)} style={{ ...iBase,width:"auto",minWidth:160 }}>
            <option value="All">All Statuses</option>{STATUSES.map(s=><option key={s}>{s}</option>)}
          </select>
          <select value={fQR} onChange={e=>setFQR(e.target.value)} style={{ ...iBase,width:"auto",minWidth:130 }}>
            <option value="All">All QR Status</option>
            <option value="Linked">QR Linked</option>
            <option value="Unlinked">No QR Tag</option>
          </select>
          <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{ ...iBase,width:"auto",minWidth:120 }}>
            <option value="tag">Sort: Tag</option>
            <option value="name">Sort: Name</option>
            <option value="status">Sort: Status</option>
            <option value="type">Sort: Type</option>
          </select>
        </div>

        {/* Table */}
        {loading?(
          <div style={{ textAlign:"center",color:"#94a3b8",padding:60 }}>Loading…</div>
        ):filtered.length===0?(
          <div style={{ textAlign:"center",padding:70 }}>
            <div style={{ fontSize:38,marginBottom:12 }}>📦</div>
            <div style={{ fontSize:16,fontWeight:600,color:"#475569" }}>
              {assets.length===0?"No assets yet — add your first one above":"No results match your filters"}
            </div>
          </div>
        ):(
          <div style={{ background:T.white,border:`1.5px solid ${T.border}`,borderRadius:10,
            overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,.04)" }}>
            <table style={{ width:"100%",borderCollapse:"collapse" }}>
              <thead>
                <tr style={{ background:T.bg,borderBottom:`1.5px solid ${T.border}` }}>
                  {["Asset Tag","Name / Model","Type","Intune Name","Win License","Autopilot","Status","Condition","QR","📷","Location","Assigned To"].map(h=>(
                    <th key={h} style={{ textAlign:"left",padding:"9px 14px",fontSize:11,fontWeight:700,
                      color:"#94a3b8",letterSpacing:.7,textTransform:"uppercase" }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filtered.map((a,i)=>{
                  const photoCount=(a.shippingRecords||[]).reduce((n,r)=>n+(r.photos?.length||0),0);
                  return (
                    <tr key={a.id} className="rh"
                      style={{ borderBottom:i<filtered.length-1?`1px solid ${T.border}`:"none",transition:"background .1s" }}
                      onClick={()=>openDetail(a)}>
                      <td style={{ padding:"10px 14px" }}>
                        <span style={{ fontFamily:T.mono,fontSize:13,fontWeight:600,color:T.slate }}>{a.tag}</span>
                        {(a.warrantyExpired||soonExp(a.warrantyExpiry))&&<span title={a.warrantyExpired?"Warranty expired":"Warranty expiring soon"} style={{ marginLeft:6,fontSize:11,color:"#dc2626" }}>⚠</span>}
                      </td>
                      <td style={{ padding:"10px 14px",fontSize:13,color:T.slate,fontWeight:500,maxWidth:190 }}>
                        <div style={{ overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>
                          {a.name||[a.make,a.model].filter(Boolean).join(" ")||<span style={{color:"#94a3b8"}}>—</span>}
                        </div>
                      </td>
                      <td style={{ padding:"10px 14px",fontSize:12,color:T.muted }}>{a.type}</td>
                      <td style={{ padding:"10px 14px" }}>
                        {(a.type==="Desktop"||a.type==="Laptop")&&a.entraName
                          ? <span style={{ fontFamily:T.mono,fontSize:12,fontWeight:600,color:T.amberD,
                              background:T.amberL,padding:"2px 7px",borderRadius:4,
                              border:`1px solid #fcd34d` }}>{a.entraName}</span>
                          : <span style={{ color:"#d1d5db" }}>—</span>}
                      </td>
                      <td style={{ padding:"10px 14px",textAlign:"center" }}>
                        {(a.type==="Desktop"||a.type==="Laptop")
                          ? a.windowsLicense
                            ? <span style={{ fontSize:12,fontWeight:700,color:"#15803d",background:"#f0fdf4",
                                border:"1.5px solid #86efac",borderRadius:20,padding:"2px 8px" }}>✓ Yes</span>
                            : <span style={{ fontSize:12,fontWeight:700,color:"#dc2626",background:"#fef2f2",
                                border:"1.5px solid #fca5a5",borderRadius:20,padding:"2px 8px" }}>✗ No</span>
                          : <span style={{ color:"#d1d5db" }}>—</span>}
                      </td>
                      <td style={{ padding:"10px 14px",textAlign:"center" }}>
                        {(a.type==="Desktop"||a.type==="Laptop")
                          ? a.autopilotReady
                            ? <span style={{ fontSize:12,fontWeight:700,color:"#1d4ed8",background:"#eff6ff",
                                border:"1.5px solid #93c5fd",borderRadius:20,padding:"2px 8px" }}>✓ Yes</span>
                            : <span style={{ fontSize:12,fontWeight:700,color:"#6b7280",background:"#f9fafb",
                                border:"1.5px solid #d1d5db",borderRadius:20,padding:"2px 8px" }}>✗ No</span>
                          : <span style={{ color:"#d1d5db" }}>—</span>}
                      </td>
                      <td style={{ padding:"10px 14px" }}><Badge status={a.status} /></td>
                      <td style={{ padding:"10px 14px" }}><CondPill condition={a.condition} /></td>
                      <td style={{ padding:"10px 14px" }}>{a.qrCode?<span title={a.qrCode} style={{ fontSize:16 }}>▣</span>:<span style={{ fontSize:14,color:"#d1d5db" }}>▢</span>}</td>
                      <td style={{ padding:"10px 14px",fontSize:12,color:photoCount>0?"#1d4ed8":T.muted }}>
                        {photoCount>0?`📷 ${photoCount}`:"—"}
                      </td>
                      <td style={{ padding:"10px 14px",fontSize:12,color:T.muted }}>{a.location||"—"}</td>
                      <td style={{ padding:"10px 14px",fontSize:12,color:T.muted }}>{a.assignedTo||"—"}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            <div style={{ padding:"9px 14px",borderTop:`1px solid ${T.border}`,
              fontSize:12,color:"#94a3b8",display:"flex",justifyContent:"space-between" }}>
              <span>{filtered.length} asset{filtered.length!==1?"s":""} shown</span>
              <span>{stats.linked}/{stats.total} QR linked</span>
            </div>
          </div>
        )}
      </div>
      )}

      {/* Modals */}
      {modal?.type==="add"&&<Modal title="Add New Asset" wide onClose={()=>setModal(null)}>
        <AssetForm nextTag={genTag(counter)} onSave={handleAdd} onCancel={()=>setModal(null)} allAssets={assets} />
      </Modal>}
      {modal?.type==="edit"&&selected&&<Modal title={`Edit — ${selected.tag}`} wide onClose={()=>setModal({type:"detail"})}>
        <AssetForm initial={selected} onSave={handleEdit} onCancel={()=>setModal({type:"detail"})} allAssets={assets} />
      </Modal>}
      {modal?.type==="checkin"&&selected&&<Modal title="Log Check-In" onClose={()=>setModal({type:"detail"})}>
        <CheckInForm asset={selected} onSave={handleCheckin} onCancel={()=>setModal({type:"detail"})} />
      </Modal>}
      {modal?.type==="shipping"&&selected&&<Modal title="Log Shipment / Transfer" wide onClose={()=>setModal({type:"detail"})}>
        <ShippingForm asset={selected} onSave={handleShipping} onCancel={()=>setModal({type:"detail"})} />
      </Modal>}
      {modal?.type==="qr"&&selected&&<QRAssocModal asset={selected} allAssets={assets}
        onSave={handleLinkQR} onRemove={handleRemoveQR} onClose={()=>setModal({type:"detail"})} />}
      {modal?.type==="detail"&&selected&&<Modal title="" wide onClose={()=>{ setModal(null); setSelected(null); }}>
        <AssetDetail asset={selected}
          onEdit={()=>setModal({type:"edit"})}
          onCheckin={()=>setModal({type:"checkin"})}
          onShipping={()=>setModal({type:"shipping"})}
          onLinkQR={()=>setModal({type:"qr"})}
          onDelete={handleDelete} />
      </Modal>}
      </>)}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
