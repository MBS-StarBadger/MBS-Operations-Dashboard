    // ── API Configuration ──────────────────────────────────────────────────────
    window.API_BASE = window.location.origin;
    window.authToken = localStorage.getItem('mbs_token') || null;

    window.api = {
      setToken: function(token) {
        window.authToken = token;
        if (token) localStorage.setItem('mbs_token', token);
        else localStorage.removeItem('mbs_token');
      },
      headers: function() {
        return {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + window.authToken
        };
      },
      get: async function(path) {
        const r = await fetch(window.API_BASE + path, { headers: this.headers() });
        if (r.status === 401) { window.authToken = null; localStorage.removeItem('mbs_token'); throw new Error('Unauthorized'); }
        return r.json();
      },
      post: async function(path, body) {
        const r = await fetch(window.API_BASE + path, { method:'POST', headers: this.headers(), body: JSON.stringify(body) });
        if (r.status === 401) { window.authToken = null; localStorage.removeItem('mbs_token'); throw new Error('Unauthorized'); }
        return r.json();
      },
      put: async function(path, body) {
        const r = await fetch(window.API_BASE + path, { method:'PUT', headers: this.headers(), body: JSON.stringify(body) });
        if (r.status === 401) { window.authToken = null; localStorage.removeItem('mbs_token'); throw new Error('Unauthorized'); }
        return r.json();
      },
      del: async function(path) {
        const r = await fetch(window.API_BASE + path, { method:'DELETE', headers: this.headers() });
        if (r.status === 401) { window.authToken = null; localStorage.removeItem('mbs_token'); throw new Error('Unauthorized'); }
        return r.json();
      }
    };

// ── Consumables API Layer ─────────────────────────────────────────────────────
async function loadConsumables() {
  try {
    const data = await window.api.get('/api/consumables');
    if (data.length === 0) {
      for (const item of getDefaultConsumables()) {
        await window.api.post('/api/consumables', { name: item.name, quantity: item.qty, low_at: item.lowAt, notes: item.notes });

      const seeded = await window.api.get('/api/consumables');
      return seeded.map(i => ({ id: i.id, name: i.name, qty: i.quantity, lowAt: i.low_at, notes: i.notes || "" }));
    }
    return data.map(i => ({ id: i.id, name: i.name, qty: i.quantity, lowAt: i.low_at, notes: i.notes || "" }));
  } catch { return getDefaultConsumables(); }
}

// ── Image helpers ────────────────────────────────────────────────────────────
function readFileAsDataURL(file) {
  return new Promise((res,rej) => {
    const r = new FileReader();
    r.onload  = () => res(r.result);
    r.onerror = () => rej(new Error("Read failed"));
    r.readAsDataURL(file);
  });
}
async function compressImage(file, maxPx=1200, quality=0.75) {
  const dataUrl = await readFileAsDataURL(file);
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
      const w = Math.round(img.width  * scale);
      const h = Math.round(img.height * scale);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      res(c.toDataURL("image/jpeg", quality));
    };
    img.src = dataUrl;
  });
}

// ── Shared UI ────────────────────────────────────────────────────────────────
const iBase = {

function FWrap({ label, children }) {

// ── Photo Upload Component ───────────────────────────────────────────────────
function PhotoUploader({ photos, onChange }) {
  const [dragging, setDragging] = useState(false);

  const processFiles = async (files) => {
    const newPhotos = [];
    for (const file of Array.from(files)) {
      if (!file.type.startsWith("image/")) continue;
      try {
        const compressed = await compressImage(file);
        newPhotos.push({ id: Date.now() + Math.random(), dataUrl: compressed, name: file.name, addedAt: nowISO() });
      } catch {}
    }
    if (newPhotos.length) onChange([...photos, ...newPhotos]);
  };

  const removePhoto = (id) => onChange(photos.filter(p => p.id !== id));

  return (
    <div style={{ display:"flex",flexDirection:"column",gap:10 }}>
      {/* Drop zone */}
      <div
        onDragOver={e=>{ e.preventDefault(); setDragging(true); }}
        onDragLeave={()=>setDragging(false)}
        onDrop={e=>{ e.preventDefault(); setDragging(false); processFiles(e.dataTransfer.files); }}
        style={{ border:`2px dashed ${dragging?T.amber:T.border}`, borderRadius:8,
          padding:"20px 16px", textAlign:"center", background:dragging?T.amberL:T.bg,
          transition:"all .15s", cursor:"pointer" }}
        onClick={()=>document.getElementById("photo-upload-input").click()}>
        <div style={{ fontSize:24, marginBottom:6 }}>📷</div>
        <div style={{ fontSize:13, fontWeight:600, color:T.slate }}>Click to add photos</div>
        <div style={{ fontSize:11, color:T.muted, marginTop:2 }}>or drag and drop — iPhone camera photos work great</div>
        <input id="photo-upload-input" type="file" accept="image/*" multiple capture="environment"
          style={{ display:"none" }} onChange={e=>processFiles(e.target.files)} />
      </div>

      {/* Photo grid */}
      {photos.length > 0 && (
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(120px,1fr))", gap:8 }}>
          {photos.map(p=>(
            <div key={p.id} style={{ position:"relative", borderRadius:7, overflow:"hidden",
              border:`1.5px solid ${T.border}`, background:T.bg }}>
              <img src={p.dataUrl} alt={p.name}
                style={{ width:"100%", height:100, objectFit:"cover", display:"block" }} />
              <div style={{ padding:"4px 6px", fontSize:10, color:T.muted,
                overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{p.name}</div>
              <button onClick={()=>removePhoto(p.id)}
                style={{ position:"absolute",top:4,right:4,background:"rgba(0,0,0,.55)",
                  border:"none",borderRadius:"50%",width:20,height:20,cursor:"pointer",
                  color:"#fff",fontSize:12,lineHeight:1,display:"flex",alignItems:"center",justifyContent:"center" }}>×</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

                      transition:"background .15s" }}

                ))}

                  {r.photos.length} photo{r.photos.length>1?"s":""}

        ))}
      </div>
      {lightbox&&<Lightbox photo={lightbox} onClose={()=>setLightbox(null)} />}

}

// ── QR Association Modal ─────────────────────────────────────────────────────
function QRAssocModal({ asset, allAssets, onSave, onRemove, onClose }) {
  const [val,setVal]           = useState(asset.qrCode||"");
  const [scanning,setScanning] = useState(false);
  const [camErr,setCamErr]     = useState("");
  const [jsQRLib,setJsQRLib]   = useState(null);
  const videoRef  = useRef(null);
  const canvasRef = useRef(null);
  const rafRef    = useRef(null);
  const streamRef = useRef(null);

  const conflict = val && allAssets.find(a=>a.id!==asset.id&&a.qrCode===val.trim());

  // Lazy-load jsQR fallback
  useEffect(()=>{
    if(scanning && !jsQRLib){
      const s=document.createElement("script");
      s.src="/jsqr.min.js";
      s.onload=()=>setJsQRLib(()=>window.jsQR);
      document.head.appendChild(s);
    }
  },[scanning]);

  const stopCamera = useCallback(()=>{
    cancelAnimationFrame(rafRef.current);
    if(streamRef.current) streamRef.current.getTracks().forEach(t=>t.stop());
    streamRef.current=null;
    setScanning(false);
  },[]);

  const startCamera = useCallback(async()=>{
    setCamErr(""); setVal("");
    setScanning(true);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:"environment", width:{ideal:1280}, height:{ideal:720} }
      });
      streamRef.current=stream;
      await new Promise(r=>setTimeout(r,100));
      if(videoRef.current){
        videoRef.current.srcObject=stream;
        await videoRef.current.play();
      }
    } catch(e){
      setCamErr("Camera access denied. Please type the QR code value manually.");
      setScanning(false);
    }
  },[]);

  // Scan loop - uses jsQR every 300ms
  useEffect(()=>{
    if(!scanning) return;
    const interval = setInterval(()=>{
      const video=videoRef.current;
      const canvas=canvasRef.current;
      if(!video||!canvas||video.readyState<2) return;
      canvas.width=video.videoWidth||640;
      canvas.height=video.videoHeight||480;
      const ctx=canvas.getContext("2d");
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      if(window.jsQR){
        const img=ctx.getImageData(0,0,canvas.width,canvas.height);
        const code=window.jsQR(img.data,img.width,img.height,{inversionAttempts:"attemptBoth"});
        if(code){
          const v=code.data;
          const m=v.match(/\/asset\/([^/?#]+)/);
          stopCamera();
          setVal(m?m[1]:v);
        }
      }
    },300);
    return ()=>clearInterval(interval);
  },[scanning,stopCamera]);

  useEffect(()=>()=>stopCamera(),[]);

  return (
    <Modal title="Associate QR Code"
      sub={`${asset.tag} — ${asset.name||[asset.make,asset.model].filter(Boolean).join(" ")||"Unnamed"}`}
      onClose={()=>{ stopCamera(); onClose(); }}>
      <div style={{ display:"flex",flexDirection:"column",gap:14 }}>

        {/* Camera viewfinder */}
        {scanning ? (
          <div style={{ display:"flex",flexDirection:"column",gap:10 }}>
            <div style={{ position:"relative",borderRadius:8,overflow:"hidden",background:"#000",
              border:`2px solid ${T.amber}` }}>
              <video ref={videoRef} muted playsInline
                style={{ width:"100%",maxHeight:260,objectFit:"cover",display:"block" }} />
              <canvas ref={canvasRef} style={{ display:"none" }} />
              {/* Targeting overlay */}
              <div style={{ position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none" }}>
                <div style={{ width:160,height:160,border:"2px solid rgba(245,158,11,.85)",borderRadius:12,
                  boxShadow:"0 0 0 9999px rgba(0,0,0,.38)" }}>
                  {[["0","0"],["0","auto"],["auto","0"],["auto","auto"]].map(([t,b],i)=>(
                    <div key={i} style={{ position:"absolute",
                      top:t,bottom:b,left:i<2?"0":"auto",right:i>=2?"0":"auto",
                      width:16,height:16,
                      borderTop:t==="0"?"3px solid #f59e0b":"none",
                      borderBottom:b==="0"?"3px solid #f59e0b":"none",
                      borderLeft:(i===0||i===2)?"3px solid #f59e0b":"none",
                      borderRight:(i===1||i===3)?"3px solid #f59e0b":"none",
                    }}/>
                  ))}
                </div>
              </div>
              <div style={{ position:"absolute",bottom:8,left:0,right:0,textAlign:"center",
                fontSize:12,color:"rgba(255,255,255,.85)",fontWeight:600 }}>
                Point at QR sticker…
              </div>
            </div>
            <Btn variant="secondary" onClick={stopCamera}>✕ Cancel Scan</Btn>
          </div>
        ) : (
          <div style={{ display:"flex",flexDirection:"column",gap:10 }}>
            {/* Scan button */}
            <button onClick={startCamera}
              style={{ display:"flex",alignItems:"center",justifyContent:"center",gap:10,
                background:"linear-gradient(135deg,#1e293b 0%,#334155 100%)",
                color:"#fff",border:"none",borderRadius:8,padding:"14px 18px",
                fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:T.font,
                boxShadow:"0 2px 8px rgba(0,0,0,.18)" }}>
              <span style={{ fontSize:22 }}>📷</span>
              Scan QR Sticker with Camera
            </button>
            {/* Divider */}
            <div style={{ display:"flex",alignItems:"center",gap:10 }}>
              <div style={{ flex:1,height:1,background:T.border }} />
              <span style={{ fontSize:11,color:T.muted,fontWeight:600 }}>OR TYPE MANUALLY</span>
              <div style={{ flex:1,height:1,background:T.border }} />
            </div>
            <TInput label="QR Code Value" value={val} onChange={e=>setVal(e.target.value)} placeholder="e.g. QR-00042" />
          </div>
        )}

        {camErr&&(
          <div style={{ background:"#fef2f2",border:"1.5px solid #fca5a5",borderRadius:6,padding:"10px 14px",fontSize:12,color:"#dc2626" }}>
            ⚠ {camErr}
          </div>
        )}

        {/* Scanned result preview */}
        {val&&!scanning&&(
          <div style={{ background:"#f0fdf4",border:"1.5px solid #86efac",borderRadius:6,padding:"10px 14px",
            fontSize:13,color:"#15803d",display:"flex",alignItems:"center",gap:8 }}>
            <span style={{ fontSize:18 }}>▣</span>
            <span>Ready to link: <strong style={{fontFamily:T.mono}}>{val}</strong></span>
          </div>
        )}

        {conflict&&(
          <div style={{ background:"#fef2f2",border:"1.5px solid #fca5a5",borderRadius:6,padding:"10px 14px",fontSize:12,color:"#dc2626" }}>
            ⚠ Already linked to <strong>{conflict.tag}</strong>. Scan or enter a different sticker.
          </div>
        )}

        {asset.qrCode&&(
          <div style={{ background:"#f8fafc",border:"1.5px solid #e2e8f0",borderRadius:6,padding:"10px 14px",
            fontSize:12,color:T.muted,display:"flex",justifyContent:"space-between",alignItems:"center" }}>
            <span>Currently linked: <strong style={{fontFamily:T.mono,color:T.slate}}>{asset.qrCode}</strong></span>
            <button onClick={onRemove} style={{ background:"none",border:"none",color:"#dc2626",fontSize:12,cursor:"pointer",fontWeight:600 }}>Remove</button>
          </div>
        )}

        <div style={{ height:1,background:T.border }} />
        <div style={{ display:"flex",gap:8,justifyContent:"flex-end" }}>
          <Btn variant="secondary" onClick={()=>{ stopCamera(); onClose(); }}>Cancel</Btn>
          <Btn variant="primary"
            onClick={()=>{ if(!conflict&&val.trim()) onSave(val.trim()); }}
            style={{ opacity:(!val.trim()||conflict||scanning)?"0.4":"1",pointerEvents:(!val.trim()||conflict||scanning)?"none":"auto" }}>
            {asset.qrCode?"Update QR Link":"Link QR Code"}
          </Btn>
        </div>
      </div>
    </Modal>
  );
}

        display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10 }}>

          <Btn variant="danger" sm onClick={()=>setConfirmDelete(true)}>Delete Asset</Btn>
        ) : (
          <div style={{ display:"flex",alignItems:"center",gap:10,background:"#fef2f2",
            border:"1.5px solid #fca5a5",borderRadius:8,padding:"8px 14px",flexWrap:"wrap",gap:8 }}>
            <span style={{ fontSize:13,fontWeight:600,color:"#dc2626" }}>

        )}
        <span style={{ fontSize:11,color:"#94a3b8" }}>Added {fmtDate(asset.createdAt)}</span>
      </div>
      {lightbox&&<Lightbox photo={lightbox} onClose={()=>setLightbox(null)} />}
    </div>
  );
}

// ── QR Scanner ───────────────────────────────────────────────────────────────
function QRLookup({ assets, onSelect }) {
  const [val,setVal]         = useState("");
  const [res,setRes]         = useState(null);
  const [scanning,setScanning] = useState(false);
  const [camErr,setCamErr]   = useState("");
  const [jsQRLib,setJsQRLib] = useState(null);
  const videoRef  = useRef(null);
  const canvasRef = useRef(null);
  const rafRef    = useRef(null);
  const streamRef = useRef(null);

  // Lazy-load jsQR for fallback
  useEffect(()=>{
    if(scanning && !jsQRLib){
      const s=document.createElement("script");
      s.src="/jsqr.min.js";
      s.onload=()=>setJsQRLib(()=>window.jsQR);
      document.head.appendChild(s);
    }
  },[scanning]);

  const doLookup = useCallback((raw)=>{
    const q=raw.trim();
    if(!q) return;
    setVal(q);
    setRes(assets.find(a=>a.qrCode===q||a.tag.toLowerCase()===q.toLowerCase())||false);
  },[assets]);

  const stopCamera = useCallback(()=>{
    cancelAnimationFrame(rafRef.current);
    if(streamRef.current) streamRef.current.getTracks().forEach(t=>t.stop());
    streamRef.current=null;
    setScanning(false);
  },[]);

  const startCamera = useCallback(async()=>{
    setCamErr(""); setRes(null); setVal("");
    setScanning(true);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:"environment", width:{ideal:1280}, height:{ideal:720} }
      });
      streamRef.current=stream;
      await new Promise(r=>setTimeout(r,100));
      if(videoRef.current){
        videoRef.current.srcObject=stream;
        await videoRef.current.play();
      }
    } catch(e){
      setCamErr("Camera access denied or unavailable. Please type the QR value manually.");
      setScanning(false);
    }
  },[]);

  // Scan loop
  useEffect(()=>{
    if(!scanning) return;
    const tick=()=>{
      const video=videoRef.current;
      const canvas=canvasRef.current;
      if(!video||!canvas||video.readyState<2){ rafRef.current=requestAnimationFrame(tick); return; }
      canvas.width=video.videoWidth;
      canvas.height=video.videoHeight;
      const ctx=canvas.getContext("2d");
      ctx.drawImage(video,0,0);
      // Try BarcodeDetector first (Chrome/Android)
      if(window.BarcodeDetector){
        new window.BarcodeDetector({formats:["qr_code"]}).detect(canvas)
          .then(codes=>{ if(codes.length){ stopCamera(); doLookup(codes[0].rawValue); } })
          .catch(()=>{});
      } else if(window.jsQR){
        // jsQR fallback
        const img=ctx.getImageData(0,0,canvas.width,canvas.height);
        const code=window.jsQR(img.data,img.width,img.height,{inversionAttempts:"attemptBoth"});
        if(code){ stopCamera(); doLookup(code.data); return; }
      }
      rafRef.current=requestAnimationFrame(tick);
    };
    rafRef.current=requestAnimationFrame(tick);
    return ()=>cancelAnimationFrame(rafRef.current);
  },[scanning,jsQRLib,doLookup,stopCamera]);

  useEffect(()=>()=>stopCamera(),[]);

  return (
    <div style={{ background:T.amberL,border:`1.5px solid #fcd34d`,borderRadius:10,
      padding:"14px 18px",display:"flex",flexDirection:"column",gap:12 }}>
      <div style={{ fontSize:12,fontWeight:700,color:T.amberD,letterSpacing:.5 }}>▣ QR / TAG LOOKUP</div>

      {/* Camera viewfinder */}
      {scanning && (
        <div style={{ position:"relative",borderRadius:8,overflow:"hidden",background:"#000",
          border:`2px solid ${T.amber}` }}>
          <video ref={videoRef} muted playsInline
            style={{ width:"100%",maxHeight:240,objectFit:"cover",display:"block" }} />
          <canvas ref={canvasRef} style={{ display:"none" }} />
          {/* Targeting overlay */}
          <div style={{ position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none" }}>
            <div style={{ width:160,height:160,border:"2px solid rgba(245,158,11,.8)",borderRadius:12,
              boxShadow:"0 0 0 9999px rgba(0,0,0,.35)" }}>
              {/* Corner marks */}
              {[["0","0"],["0","auto"],["auto","0"],["auto","auto"]].map(([t,b],i)=>(
                <div key={i} style={{ position:"absolute",
                  top:t==="0"?-2:"auto", bottom:b==="auto"?"auto":-2,
                  left:i%2===0?-2:"auto", right:i%2===0?"auto":-2,
                  width:16,height:16,
                  borderTop:   (i<2)  ?`3px solid ${T.amber}`:"none",
                  borderBottom:(i>=2) ?`3px solid ${T.amber}`:"none",
                  borderLeft:  (i%2===0)?`3px solid ${T.amber}`:"none",
                  borderRight: (i%2!==0)?`3px solid ${T.amber}`:"none",
                }} />
              ))}
            </div>
          </div>
          <div style={{ position:"absolute",bottom:8,left:0,right:0,textAlign:"center",
            fontSize:12,color:"rgba(255,255,255,.85)",fontWeight:600 }}>
            Point camera at QR code
          </div>
          <button onClick={stopCamera} style={{ position:"absolute",top:8,right:8,
            background:"rgba(0,0,0,.55)",border:"none",borderRadius:"50%",width:28,height:28,
            color:"#fff",fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center" }}>×</button>
        </div>
      )}

      {/* Manual input row */}
      <div style={{ display:"flex",gap:8 }}>
        <input value={val} onChange={e=>setVal(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&doLookup(val)}
          placeholder="Type tag or QR value… (e.g. MBS-1001)"
          style={{ ...iBase,flex:1 }} />
        {!scanning
          ? <Btn variant="amber_out" onClick={startCamera}>📷 Scan</Btn>
          : <Btn variant="secondary" onClick={stopCamera}>Stop</Btn>
        }
        <Btn variant="primary" onClick={()=>doLookup(val)}>Look Up</Btn>
      </div>

      {camErr&&<div style={{ fontSize:12,color:"#b45309",background:"#fffbeb",
        border:"1px solid #fcd34d",borderRadius:6,padding:"8px 12px" }}>{camErr}</div>}

      {res===false&&<div style={{ fontSize:12,color:"#dc2626",fontWeight:600 }}>
        No asset found for "{val}" — may not be registered yet.
      </div>}

      {res&&(
        <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",
          background:T.white,border:"1.5px solid #86efac",borderRadius:7,
          padding:"10px 14px",flexWrap:"wrap",gap:8 }}>
          <div>
            <span style={{ fontFamily:T.mono,fontWeight:700,color:T.slate,fontSize:13 }}>{res.tag}</span>
            <span style={{ color:T.slate,marginLeft:10,fontSize:13 }}>
              {res.name||[res.make,res.model].filter(Boolean).join(" ")||"Unnamed"}
            </span>
          </div>
          <div style={{ display:"flex",gap:8,alignItems:"center" }}>
            <Badge status={res.status} />
            <Btn variant="primary" sm onClick={()=>onSelect(res)}>Open →</Btn>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Consumables Tab ───────────────────────────────────────────────────────────
function ConsumablesTab() {
  const [items, setItems]       = useState([]);
  const [loading, setLoading]   = useState(true);
  const [editId, setEditId]     = useState(null);   // inline edit
  const [addOpen, setAddOpen]   = useState(false);
  const [newName, setNewName]   = useState("");
  const [newLow, setNewLow]     = useState(2);
  const [nextId, setNextId]     = useState(200);
  const [confirmDel, setConfirmDel] = useState(null);

  useEffect(()=>{
    (async()=>{
      const data = await loadConsumables();
      setItems(data);
      const maxId = data.reduce((m,i)=>Math.max(m,i.id),199);
      setNextId(maxId+1);
      setLoading(false);
    })();
  },[]);

  const persist = async (next) => { setItems(next); await saveConsumables(next); };

  const adjust = async (id, delta) => {
    const item = items.find(i => String(i.id) === String(id));
    if (!item) return;
    const newQty = Math.max(0, item.qty + delta);
    setItems(prev => prev.map(i => String(i.id) === String(id) ? {...i, qty:newQty} : i));
    try {
      await window.api.put('/api/consumables/' + id, { name:item.name, quantity:newQty, low_at:item.lowAt, notes:item.notes||"" });
    } catch(e) {
      setItems(prev => prev.map(i => String(i.id) === String(id) ? {...i, qty:item.qty} : i));
    }
  };

  const updateField = async (id, field, val) => {
    const item = items.find(i => String(i.id) === String(id));
    if (!item) return;
    const updated = {...item, [field]:val};
    setItems(prev => prev.map(i => String(i.id) === String(id) ? updated : i));
    try {
      await window.api.put('/api/consumables/' + id, { name:updated.name, quantity:updated.qty, low_at:updated.lowAt, notes:updated.notes||"" });
    } catch {}
  };

  const addItem = async () => {
    if (!newName.trim()) return;
    try {
      await window.api.post('/api/consumables', {
        name: newName.trim(), quantity: 0, low_at: Math.max(0, parseInt(newLow)||0), notes: ""
      });
      const fresh = await window.api.get('/api/consumables');
      setItems(fresh.map(i => ({ id: i.id, name: i.name, qty: i.quantity, lowAt: i.low_at, notes: i.notes||"" })));
      setNewName(""); setNewLow(2); setAddOpen(false);
    } catch(e) { alert("Failed to add item: " + e.message); }
  };

  const deleteItem = async (id) => {
    try {
      await window.api.del('/api/consumables/' + id);
      setItems(prev => prev.filter(i => String(i.id) !== String(id)));
      setConfirmDel(null);
    } catch(e) { alert("Failed to delete: " + e.message); }
  };

  if (loading) return <div style={{ textAlign:"center",color:"#94a3b8",padding:60 }}>Loading…</div>;

  const lowCount = items.filter(i=>i.qty<=i.lowAt&&i.lowAt>0).length;
  const totalQty  = items.reduce((s,i)=>s+i.qty, 0);

  return (
    <div style={{ padding:"20px 28px" }}>

      {/* Summary bar */}
      <div style={{ display:"flex",gap:16,marginBottom:20,flexWrap:"wrap",alignItems:"center" }}>
        <div style={{ background:T.white,border:`1.5px solid ${T.border}`,borderRadius:10,
          padding:"12px 20px",display:"flex",flexDirection:"column",gap:2,minWidth:130 }}>
          <div style={{ fontSize:10,fontWeight:700,color:"#94a3b8",letterSpacing:.7,textTransform:"uppercase" }}>Total Items Tracked</div>
          <div style={{ fontSize:28,fontWeight:700,color:T.slate,fontFamily:T.mono }}>{items.length}</div>
        </div>
        <div style={{ background:T.white,border:`1.5px solid ${T.border}`,borderRadius:10,
          padding:"12px 20px",display:"flex",flexDirection:"column",gap:2,minWidth:130 }}>
          <div style={{ fontSize:10,fontWeight:700,color:"#94a3b8",letterSpacing:.7,textTransform:"uppercase" }}>Total Units in Stock</div>
          <div style={{ fontSize:28,fontWeight:700,color:T.slate,fontFamily:T.mono }}>{totalQty}</div>
        </div>
        {lowCount>0&&(
          <div style={{ background:"#fffbeb",border:"1.5px solid #fcd34d",borderRadius:10,
            padding:"12px 20px",display:"flex",flexDirection:"column",gap:2,minWidth:130 }}>
            <div style={{ fontSize:10,fontWeight:700,color:"#b45309",letterSpacing:.7,textTransform:"uppercase" }}>Low Stock</div>
            <div style={{ fontSize:28,fontWeight:700,color:"#b45309",fontFamily:T.mono }}>{lowCount}</div>
          </div>
        )}
        <div style={{ marginLeft:"auto" }}>
          <Btn variant="primary" onClick={()=>setAddOpen(v=>!v)}>+ Add Item</Btn>
        </div>
      </div>

      {/* Add item form */}
      {addOpen&&(
        <div style={{ background:T.bg,border:`1.5px solid ${T.border}`,borderRadius:10,
          padding:"16px 20px",marginBottom:16,display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end" }}>
          <div style={{ flex:2,minWidth:200 }}>
            <FWrap label="Item Name">
              <input value={newName} onChange={e=>setNewName(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&addItem()}
                placeholder="e.g. USB-C to USB-A Adapters"
                style={{...iBase}} autoFocus />
            </FWrap>
          </div>
          <div style={{ width:130 }}>
            <FWrap label="Low Stock Alert At">
              <input type="number" min="0" value={newLow} onChange={e=>setNewLow(e.target.value)}
                style={{...iBase}} />
            </FWrap>
          </div>
          <div style={{ display:"flex",gap:8 }}>
            <Btn variant="secondary" onClick={()=>{ setAddOpen(false); setNewName(""); setNewLow(2); }}>Cancel</Btn>
            <Btn variant="primary" onClick={addItem} style={{ opacity:newName.trim()?1:.4 }}>Add</Btn>
          </div>
        </div>
      )}

      {/* Table */}
      <div style={{ background:T.white,border:`1.5px solid ${T.border}`,borderRadius:10,overflow:"hidden",
        boxShadow:"0 1px 4px rgba(0,0,0,.04)" }}>
        <table style={{ width:"100%",borderCollapse:"collapse" }}>
          <thead>
            <tr style={{ background:T.bg,borderBottom:`1.5px solid ${T.border}` }}>
              {["Item / Description","Quantity","Low Stock Alert","Notes",""].map(h=>(
                <th key={h} style={{ textAlign:h==="Quantity"?"center":"left",padding:"9px 16px",fontSize:11,
                  fontWeight:700,color:"#94a3b8",letterSpacing:.7,textTransform:"uppercase",
                  whiteSpace:"nowrap" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {items.map((item,i)=>{
              const isLow = item.lowAt>0 && item.qty<=item.lowAt;
              const isEditing = editId===item.id;
              return (
                <tr key={item.id}
                  style={{ borderBottom:i<items.length-1?`1px solid ${T.border}`:"none",
                    background:isLow?"#fffdf4":"transparent",transition:"background .1s" }}>

                  {/* Name */}
                  <td style={{ padding:"12px 16px",fontSize:14,fontWeight:600,color:T.slate }}>
                    {isEditing ? (
                      <input value={item.name}
                        onChange={e=>updateField(item.id,"name",e.target.value)}
                        style={{...iBase,fontSize:14,fontWeight:600,width:"100%"}} />
                    ) : (
                      <span style={{ display:"flex",alignItems:"center",gap:8 }}>
                        {item.name}
                        {isLow&&<span style={{ fontSize:10,fontWeight:700,color:"#b45309",background:"#fef3c7",
                          border:"1px solid #fcd34d",borderRadius:20,padding:"1px 7px" }}>⚠ Low</span>}
                      </span>
                    )}
                  </td>

                  {/* Quantity stepper */}
                  <td style={{ padding:"12px 16px",textAlign:"center" }}>
                    <div style={{ display:"inline-flex",alignItems:"center",gap:0,
                      border:`1.5px solid ${isLow?"#fcd34d":T.border}`,borderRadius:8,overflow:"hidden" }}>
                      <button onClick={()=>adjust(item.id,-1)}
                        disabled={item.qty===0}
                        style={{ background:item.qty===0?"#f8fafc":T.white,border:"none",
                          width:34,height:34,fontSize:18,fontWeight:700,cursor:item.qty===0?"default":"pointer",
                          color:item.qty===0?"#d1d5db":"#dc2626",transition:"background .1s",
                          display:"flex",alignItems:"center",justifyContent:"center" }}>−</button>
                      <div style={{ minWidth:46,textAlign:"center",fontSize:18,fontWeight:700,
                        fontFamily:T.mono,color:isLow?"#b45309":T.slate,
                        padding:"0 4px",background:isLow?"#fef3c7":T.white,lineHeight:"34px" }}>
                        {item.qty}
                      </div>
                      <button onClick={()=>adjust(item.id,+1)}
                        style={{ background:T.white,border:"none",width:34,height:34,
                          fontSize:18,fontWeight:700,cursor:"pointer",color:"#15803d",
                          transition:"background .1s",display:"flex",alignItems:"center",justifyContent:"center" }}>+</button>
                    </div>
                  </td>

                  {/* Low-at threshold */}
                  <td style={{ padding:"12px 16px" }}>
                    {isEditing ? (
                      <input type="number" min="0" value={item.lowAt}
                        onChange={e=>updateField(item.id,"lowAt",parseInt(e.target.value)||0)}
                        style={{...iBase,width:80,textAlign:"center"}} />
                    ) : (
                      <span style={{ fontSize:13,color:T.muted }}>
                        {item.lowAt>0 ? `Alert at ${item.lowAt}` : <span style={{color:"#d1d5db"}}>—</span>}
                      </span>
                    )}
                  </td>

                  {/* Notes */}
                  <td style={{ padding:"12px 16px" }}>
                    {isEditing ? (
                      <input value={item.notes}
                        onChange={e=>updateField(item.id,"notes",e.target.value)}
                        placeholder="Location, brand, specs…"
                        style={{...iBase,fontSize:13}} />
                    ) : (
                      <span style={{ fontSize:13,color:item.notes?T.muted:"#d1d5db",fontStyle:item.notes?"normal":"italic" }}>
                        {item.notes||"—"}
                      </span>
                    )}
                  </td>

                  {/* Actions */}
                  <td style={{ padding:"12px 16px",whiteSpace:"nowrap" }}>
                    <div style={{ display:"flex",gap:6,justifyContent:"flex-end" }}>
                      <Btn variant="secondary" sm onClick={()=>setEditId(isEditing?null:item.id)}>
                        {isEditing?"✓ Done":"Edit"}
                      </Btn>
                      {confirmDel===item.id ? (
                        <>
                          <Btn variant="danger" sm onClick={()=>deleteItem(item.id)}>Delete</Btn>
                          <Btn variant="secondary" sm onClick={()=>setConfirmDel(null)}>Cancel</Btn>
                        </>
                      ) : (
                        <Btn variant="danger" sm onClick={()=>setConfirmDel(item.id)}>✕</Btn>
                      )}
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
        <div style={{ padding:"9px 16px",borderTop:`1px solid ${T.border}`,
          fontSize:12,color:"#94a3b8",display:"flex",justifyContent:"space-between" }}>
          <span>{items.length} item type{items.length!==1?"s":""} tracked</span>
          {lowCount>0&&<span style={{ color:"#b45309",fontWeight:600 }}>⚠ {lowCount} item{lowCount!==1?"s":""} at or below low-stock threshold</span>}
        </div>
      </div>

      <div style={{ marginTop:12,fontSize:11,color:"#94a3b8" }}>
        Consumables are tracked by count only — no asset tags or custom labels required.
        Click <strong>Edit</strong> on any row to rename, adjust the low-stock alert level, or add notes.
      </div>
    </div>
  );
}

            padding:"12px 20px",display:"flex",flexDirection:"column",gap:2,minWidth:130 }}>
            <div style={{ fontSize:10,fontWeight:700,color:"#b45309",letterSpacing:.7,textTransform:"uppercase" }}>Low Stock</div>
            <div style={{ fontSize:28,fontWeight:700,color:"#b45309",fontFamily:T.mono }}>{lowStockCount}</div>
          </div>
        )}

      {/* Grid */}
      <div style={{ background:T.white,border:`1.5px solid ${T.border}`,borderRadius:10,overflow:"hidden",
        boxShadow:"0 1px 4px rgba(0,0,0,.04)" }}>
        <table style={{ width:"100%",borderCollapse:"collapse" }}>
          <thead>
            <tr style={{ background:T.bg,borderBottom:`1.5px solid ${T.border}` }}>
              <th style={{ textAlign:"left",padding:"10px 20px",fontSize:11,fontWeight:700,
                color:"#94a3b8",letterSpacing:.7,textTransform:"uppercase",width:120 }}>Color</th>
              {SHIRT_SIZES.map(sz=>(
                <th key={sz} style={{ textAlign:"center",padding:"10px 16px",fontSize:11,fontWeight:700,
                  color:"#94a3b8",letterSpacing:.7,textTransform:"uppercase" }}>{sz}</th>
              ))}
              <th style={{ textAlign:"center",padding:"10px 16px",fontSize:11,fontWeight:700,
                color:"#94a3b8",letterSpacing:.7,textTransform:"uppercase" }}>Total</th>
            </tr>
          </thead>
          <tbody>
            {SHIRT_COLORS.map((c,ci)=>{
              const rowShirts = SHIRT_SIZES.map(sz => shirts.find(s=>s.color===c.key&&s.size===sz));
              const rowTotal  = rowShirts.reduce((n,s)=>n+(s?.quantity||0),0);
              return (
                <tr key={c.key} style={{ borderBottom:ci<SHIRT_COLORS.length-1?`1px solid ${T.border}`:"none" }}>
                  {/* Color label */}
                  <td style={{ padding:"16px 20px" }}>
                    <span style={{ display:"inline-flex",alignItems:"center",gap:8,
                      background:c.bg,border:`1.5px solid ${c.border}`,borderRadius:20,
                      padding:"4px 12px",fontSize:13,fontWeight:700,color:c.text }}>
                      <span style={{ width:10,height:10,borderRadius:"50%",background:c.badge,flexShrink:0 }}/>
                      {c.label}
                    </span>
                  </td>

                  {/* Size steppers */}
                  {rowShirts.map((shirt,si)=>(
                    <td key={SHIRT_SIZES[si]} style={{ padding:"16px 12px",textAlign:"center" }}>
                      {shirt ? (
                        <div style={{ display:"inline-flex",alignItems:"center",gap:0,
                          border:`1.5px solid ${shirt.quantity===0?"#fca5a5":shirt.quantity<SHIRT_LOW_AT?"#fcd34d":c.border}`,
                          borderRadius:8,overflow:"hidden" }}>
                          <button onClick={()=>adjust(shirt.id,-1)} disabled={shirt.quantity===0}
                            style={{ background:shirt.quantity===0?"#f8fafc":T.white,border:"none",
                              width:32,height:36,fontSize:16,fontWeight:700,
                              cursor:shirt.quantity===0?"default":"pointer",
                              color:shirt.quantity===0?"#d1d5db":"#dc2626",
                              display:"flex",alignItems:"center",justifyContent:"center" }}>−</button>
                          <div style={{ minWidth:40,textAlign:"center",fontSize:17,fontWeight:700,
                            fontFamily:T.mono,color:shirt.quantity===0?"#dc2626":shirt.quantity<SHIRT_LOW_AT?"#b45309":c.badge,
                            padding:"0 4px",background:shirt.quantity===0?"#fef2f2":shirt.quantity<SHIRT_LOW_AT?"#fffbeb":c.bg,lineHeight:"36px" }}>
                            {shirt.quantity}
                          </div>
                          <button onClick={()=>adjust(shirt.id,+1)}
                            style={{ background:T.white,border:"none",width:32,height:36,
                              fontSize:16,fontWeight:700,cursor:"pointer",color:"#15803d",
                              display:"flex",alignItems:"center",justifyContent:"center" }}>+</button>
                        </div>
                      ) : <span style={{color:"#d1d5db"}}>—</span>}
                    </td>
                  ))}

                  {/* Row total */}
                  <td style={{ padding:"16px 16px",textAlign:"center" }}>
                    <span style={{ fontSize:16,fontWeight:700,fontFamily:T.mono,color:c.badge }}>{rowTotal}</span>
                  </td>
                </tr>
              );
            })}
          </tbody>
          {/* Grand total footer */}
          <tfoot>
            <tr style={{ background:T.bg,borderTop:`1.5px solid ${T.border}` }}>
              <td style={{ padding:"10px 20px",fontSize:12,fontWeight:700,color:T.muted,
                textTransform:"uppercase",letterSpacing:.6 }}>Total</td>
              {SHIRT_SIZES.map(sz=>{
                const sizeTotal = SHIRT_COLORS.reduce((n,c)=>{
                  const s = shirts.find(sh=>sh.color===c.key&&sh.size===sz);
                  return n+(s?.quantity||0);
                },0);
                return (
                  <td key={sz} style={{ padding:"10px 16px",textAlign:"center",
                    fontSize:14,fontWeight:700,fontFamily:T.mono,color:T.slate }}>{sizeTotal}</td>
                );
              })}
              <td style={{ padding:"10px 16px",textAlign:"center",
                fontSize:16,fontWeight:700,fontFamily:T.mono,color:T.slate }}>{grandTotal}</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <div style={{ marginTop:12,fontSize:11,color:"#94a3b8" }}>
        Tan shirts are for Field crew · Grey shirts are for DG crew. Click +/− to update counts.
      </div>
    </div>
  );
}

// ── Login Screen ─────────────────────────────────────────────────────────────
function LoginScreen({ onLogin }) {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError]       = useState("");
  const [loading, setLoading]   = useState(false);

  const handleLogin = async () => {
    if (!username || !password) { setError("Please enter username and password."); return; }
    setLoading(true); setError("");
    try {
      const res = await fetch(window.API_BASE + '/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok || !data.token) { setError(data.error || "Invalid credentials."); setLoading(false); return; }
      window.api.setToken(data.token);
      onLogin(data.user, data.token);
    } catch {
      setError("Cannot connect to server. Check network or try again.");
    }
    setLoading(false);
  };

  return (
    <div style={{ minHeight:"100vh", background:T.bg, display:"flex", alignItems:"center",
      justifyContent:"center", fontFamily:T.font }}>
      <div style={{ background:T.white, border:`1.5px solid ${T.border}`, borderRadius:16,
        padding:"40px 44px", width:"100%", maxWidth:420, boxShadow:"0 24px 64px rgba(0,0,0,.10)" }}>
        <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:32 }}>
          <div style={{ width:42, height:42, background:T.amber, borderRadius:10, fontSize:22,
            display:"flex", alignItems:"center", justifyContent:"center",
            boxShadow:`0 2px 8px ${T.amber}55` }}>☀</div>
          <div>
            <div style={{ fontSize:17, fontWeight:700, color:T.slate }}>Miller Bros Solar</div>
            <div style={{ fontSize:11, color:T.muted, letterSpacing:.8, textTransform:"uppercase" }}>IT Asset Management</div>
          </div>
        </div>

        <div style={{ fontSize:20, fontWeight:700, color:T.slate, marginBottom:6 }}>Sign In</div>
        <div style={{ fontSize:13, color:T.muted, marginBottom:24 }}>Enter your credentials to access the system.</div>

        <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
          <TInput label="Username" value={username} onChange={e=>setUsername(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&handleLogin()} autoFocus />
          <div>
            <FWrap label="Password">
              <input type="password" value={password} onChange={e=>setPassword(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&handleLogin()}
                style={{...iBase}} />
            </FWrap>
          </div>
          {error && (
            <div style={{ background:"#fef2f2", border:"1.5px solid #fca5a5", borderRadius:7,
              padding:"10px 14px", fontSize:13, color:"#dc2626", fontWeight:500 }}>{error}</div>
          )}
          <button onClick={handleLogin} disabled={loading}
            style={{ background:T.amber, color:"#fff", border:"none", borderRadius:8,
              padding:"11px 0", fontSize:15, fontWeight:700, cursor:loading?"wait":"pointer",
              fontFamily:T.font, opacity:loading?.7:1, boxShadow:`0 2px 8px ${T.amber}55`,
              transition:"opacity .15s" }}>
            {loading ? "Signing in…" : "Sign In"}
          </button>
        </div>
      </div>
    </div>
  );
}

const TOOL_CATEGORIES = ["Power Tools","Hand Tools","Ladders & Access","Safety / PPE","Meters & Testers","Misc"];

function ToolsTab() {
  const [items, setItems]       = useState([]);
  const [loading, setLoading]   = useState(true);
  const [editId, setEditId]     = useState(null);
  const [addOpen, setAddOpen]   = useState(false);
  const [confirmDel, setConfirmDel] = useState(null);
  const [fCat, setFCat]         = useState("All");
  const [nf, setNf]             = useState({ name:"", category:TOOL_CATEGORIES[0], tool_tag:"", condition:"Good", status:"In Storage", assigned_to:"", notes:"" });

  useEffect(()=>{
    (async()=>{
      try {
        const data = await window.api.get('/api/tools');
        setItems(data);
      } catch { setItems([]); }
      setLoading(false);
    })();
  },[]);

  const updateField = async (id, field, val) => {
    const item = items.find(i => String(i.id) === String(id));
    if (!item) return;
    const updated = {...item, [field]:val};
    setItems(prev => prev.map(i => String(i.id) === String(id) ? updated : i));
    try {
      await window.api.put('/api/tools/' + id, {
        tool_tag:updated.tool_tag, name:updated.name, category:updated.category,
        condition:updated.condition, status:updated.status, assigned_to:updated.assigned_to, notes:updated.notes||""
      });
    } catch {}
  };

  const addItem = async () => {
    if (!nf.name.trim()) return;
    try {
      await window.api.post('/api/tools', { ...nf, name:nf.name.trim() });
      const fresh = await window.api.get('/api/tools');
      setItems(fresh);
      setNf({ name:"", category:TOOL_CATEGORIES[0], tool_tag:"", condition:"Good", status:"In Storage", assigned_to:"", notes:"" });
      setAddOpen(false);
    } catch(e) { alert("Failed to add tool: " + e.message); }
  };

  const deleteItem = async (id) => {
    try {
      await window.api.del('/api/tools/' + id);
      setItems(prev => prev.filter(i => String(i.id) !== String(id)));
      setConfirmDel(null);
    } catch(e) { alert("Failed to delete: " + e.message); }
  };

  if (loading) return <div style={{ textAlign:"center",color:"#94a3b8",padding:60 }}>Loading…</div>;

  const shown = fCat==="All" ? items : items.filter(i=>i.category===fCat);
  const catCounts = TOOL_CATEGORIES.map(c=>[c, items.filter(i=>i.category===c).length]);

  return (
    <div style={{ padding:"20px 28px" }}>

      {/* Summary bar */}
      <div style={{ display:"flex",gap:16,marginBottom:20,flexWrap:"wrap",alignItems:"center" }}>
        <div style={{ background:T.white,border:`1.5px solid ${T.border}`,borderRadius:10,
          padding:"12px 20px",display:"flex",flexDirection:"column",gap:2,minWidth:130 }}>
          <div style={{ fontSize:10,fontWeight:700,color:"#94a3b8",letterSpacing:.7,textTransform:"uppercase" }}>Total Tools</div>
          <div style={{ fontSize:28,fontWeight:700,color:T.slate,fontFamily:T.mono }}>{items.length}</div>
        </div>
        <div style={{ background:T.white,border:`1.5px solid ${T.border}`,borderRadius:10,
          padding:"12px 20px",display:"flex",flexDirection:"column",gap:2,minWidth:130 }}>
          <div style={{ fontSize:10,fontWeight:700,color:"#94a3b8",letterSpacing:.7,textTransform:"uppercase" }}>Loaned Out</div>
          <div style={{ fontSize:28,fontWeight:700,color:"#6d28d9",fontFamily:T.mono }}>{items.filter(i=>i.status==="Loaned Out").length}</div>
        </div>
        <div style={{ marginLeft:"auto" }}>
          <Btn variant="primary" onClick={()=>setAddOpen(v=>!v)}>+ Add Tool</Btn>
        </div>
      </div>

      {/* Category filter */}
      <div style={{ display:"flex",gap:8,marginBottom:16,flexWrap:"wrap" }}>
        {[["All",items.length],...catCounts].map(([c,n])=>(
          <button key={c} onClick={()=>setFCat(c)}
            style={{ background:fCat===c?T.amberL:T.white,border:`1.5px solid ${fCat===c?T.amber:T.border}`,
              borderRadius:20,padding:"5px 14px",fontSize:12,fontWeight:fCat===c?700:500,
              color:fCat===c?T.amberD:T.muted,cursor:"pointer",fontFamily:T.font }}>
            {c} <span style={{ opacity:.6 }}>({n})</span>
          </button>
        ))}
      </div>

      {/* Add form */}
      {addOpen&&(
        <div style={{ background:T.bg,border:`1.5px solid ${T.border}`,borderRadius:10,
          padding:"16px 20px",marginBottom:16,display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end" }}>
          <div style={{ flex:2,minWidth:180 }}>
            <FWrap label="Tool Name"><input value={nf.name} onChange={e=>setNf({...nf,name:e.target.value})}
              onKeyDown={e=>e.key==="Enter"&&addItem()} placeholder="e.g. DeWalt 20V Impact Driver" style={{...iBase}} autoFocus /></FWrap>
          </div>
          <div style={{ width:150 }}>
            <FWrap label="Category"><select value={nf.category} onChange={e=>setNf({...nf,category:e.target.value})} style={{...iBase,cursor:"pointer"}}>
              {TOOL_CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}</select></FWrap>
          </div>
          <div style={{ width:120 }}>
            <FWrap label="Tag / ID"><input value={nf.tool_tag} onChange={e=>setNf({...nf,tool_tag:e.target.value})} placeholder="optional" style={{...iBase}} /></FWrap>
          </div>
          <div style={{ width:130 }}>
            <FWrap label="Condition"><select value={nf.condition} onChange={e=>setNf({...nf,condition:e.target.value})} style={{...iBase,cursor:"pointer"}}>
              {CONDITIONS.map(c=><option key={c} value={c}>{c}</option>)}</select></FWrap>
          </div>
          <div style={{ width:150 }}>
            <FWrap label="Status"><select value={nf.status} onChange={e=>setNf({...nf,status:e.target.value})} style={{...iBase,cursor:"pointer"}}>
              {STATUSES.map(s=><option key={s} value={s}>{s}</option>)}</select></FWrap>
          </div>
          <div style={{ display:"flex",gap:8 }}>
            <Btn variant="secondary" onClick={()=>setAddOpen(false)}>Cancel</Btn>
            <Btn variant="primary" onClick={addItem} style={{ opacity:nf.name.trim()?1:.4 }}>Add</Btn>
          </div>
        </div>
      )}

      {/* Table */}
      <div style={{ background:T.white,border:`1.5px solid ${T.border}`,borderRadius:10,overflow:"hidden",
        boxShadow:"0 1px 4px rgba(0,0,0,.04)" }}>
        <table style={{ width:"100%",borderCollapse:"collapse" }}>
          <thead>
            <tr style={{ background:T.bg,borderBottom:`1.5px solid ${T.border}` }}>
              {["Tool / Description","Category","Tag","Condition","Status","Assigned To","Notes",""].map(h=>(
                <th key={h} style={{ textAlign:"left",padding:"9px 16px",fontSize:11,
                  fontWeight:700,color:"#94a3b8",letterSpacing:.7,textTransform:"uppercase",whiteSpace:"nowrap" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {shown.map((item,i)=>{
              const isEditing = editId===item.id;
              return (
                <tr key={item.id} style={{ borderBottom:i<shown.length-1?`1px solid ${T.border}`:"none" }}>
                  <td style={{ padding:"12px 16px",fontSize:14,fontWeight:600,color:T.slate }}>
                    {isEditing ? <input value={item.name} onChange={e=>updateField(item.id,"name",e.target.value)} style={{...iBase,fontSize:14,fontWeight:600}} /> : item.name}
                  </td>
                  <td style={{ padding:"12px 16px" }}>
                    {isEditing ? (
                      <select value={item.category||""} onChange={e=>updateField(item.id,"category",e.target.value)} style={{...iBase,cursor:"pointer"}}>
                        {TOOL_CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}</select>
                    ) : <span style={{ fontSize:13,color:T.muted }}>{item.category||"—"}</span>}
                  </td>
                  <td style={{ padding:"12px 16px",fontSize:13,fontFamily:T.mono,color:T.muted }}>
                    {isEditing ? <input value={item.tool_tag||""} onChange={e=>updateField(item.id,"tool_tag",e.target.value)} style={{...iBase,fontSize:13,width:90}} /> : (item.tool_tag||"—")}
                  </td>
                  <td style={{ padding:"12px 16px" }}>
                    {isEditing ? (
                      <select value={item.condition||""} onChange={e=>updateField(item.id,"condition",e.target.value)} style={{...iBase,cursor:"pointer"}}>
                        {CONDITIONS.map(c=><option key={c} value={c}>{c}</option>)}</select>
                    ) : (item.condition ? <CondPill condition={item.condition} /> : <span style={{color:"#d1d5db"}}>—</span>)}
                  </td>
                  <td style={{ padding:"12px 16px" }}>
                    {isEditing ? (
                      <select value={item.status||""} onChange={e=>updateField(item.id,"status",e.target.value)} style={{...iBase,cursor:"pointer"}}>
                        {STATUSES.map(s=><option key={s} value={s}>{s}</option>)}</select>
                    ) : <Badge status={item.status} />}
                  </td>
                  <td style={{ padding:"12px 16px" }}>
                    {isEditing ? <input value={item.assigned_to||""} onChange={e=>updateField(item.id,"assigned_to",e.target.value)} style={{...iBase,fontSize:13}} /> :
                      <span style={{ fontSize:13,color:item.assigned_to?T.slate:"#d1d5db" }}>{item.assigned_to||"—"}</span>}
                  </td>
                  <td style={{ padding:"12px 16px" }}>
                    {isEditing ? <input value={item.notes||""} onChange={e=>updateField(item.id,"notes",e.target.value)} style={{...iBase,fontSize:13}} /> :
                      <span style={{ fontSize:13,color:item.notes?T.muted:"#d1d5db",fontStyle:item.notes?"normal":"italic" }}>{item.notes||"—"}</span>}
                  </td>
                  <td style={{ padding:"12px 16px",whiteSpace:"nowrap" }}>
                    <div style={{ display:"flex",gap:6,justifyContent:"flex-end" }}>
                      <Btn variant="secondary" sm onClick={()=>setEditId(isEditing?null:item.id)}>{isEditing?"✓ Done":"Edit"}</Btn>
                      {confirmDel===item.id ? (
                        <>
                          <Btn variant="danger" sm onClick={()=>deleteItem(item.id)}>Delete</Btn>
                          <Btn variant="secondary" sm onClick={()=>setConfirmDel(null)}>Cancel</Btn>
                        </>
                      ) : <Btn variant="danger" sm onClick={()=>setConfirmDel(item.id)}>✕</Btn>}
                    </div>
                  </td>
                </tr>
              );
            })}
            {shown.length===0&&<tr><td colSpan={8} style={{ padding:"40px",textAlign:"center",color:"#94a3b8",fontSize:13 }}>No tools yet. Click <strong>+ Add Tool</strong> to get started.</td></tr>}
          </tbody>
        </table>
      </div>

      <div style={{ marginTop:12,fontSize:11,color:"#94a3b8" }}>
        Default categories shown — these can be adjusted once the field manager finalizes the tool list.
      </div>
    </div>
  );
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr); if (isNaN(d)) return null;
  return Math.ceil((d - new Date()) / 86400000);
}
